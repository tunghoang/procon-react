server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS -- lets proxy_pass re-resolve the hexudon-service
    # container by name at request time (so a container restart / new IP is
    # picked up instead of being cached forever at nginx startup).
    resolver 127.0.0.11 valid=10s;

    # Game config / day submissions carry the full hex map, which is large.
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # --- Reverse proxy to the HEXUDON game service (FastAPI, :8001) ----------
    # hexudon.hairbui76.id.vn/api and /docs are served by this backend.
    # Cloudflare terminates TLS in front, so forward the original scheme.
    set $hexudon hexudon-service:8001;

    # ^~ stops the static-asset regex below from ever shadowing the API.
    location ^~ /api/ {
        proxy_pass http://$hexudon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # --- Reverse proxy to the team-manager (Express, :8000) -----------------
    # hexudon-service owns the root /api and /docs, so the team-manager lives
    # under /manager/*. Strip that prefix before forwarding, and rewrite any
    # root-relative redirects (e.g. Express/swagger's /docs -> /docs/) back
    # under /manager so they don't escape the sub-path. ^~ keeps the static
    # asset regex below from hijacking /manager/docs/*.js etc.
    set $manager team-manager:8000;
    location ^~ /manager/ {
        rewrite ^/manager/(.*)$ /$1 break;
        proxy_pass http://$manager;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_redirect ~^(/.*)$ /manager$1;
    }

    # FastAPI interactive docs + their OpenAPI schema.
    location = /docs {
        proxy_pass http://$hexudon;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /redoc {
        proxy_pass http://$hexudon;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /openapi.json {
        proxy_pass http://$hexudon;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA routing - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
